mainSections:
    - post
featuredImageField: image
rssFullContent: true
favicon: # e.g.: favicon placed in `static/favicon.ico` of your site folder, then set this field to `/favicon.ico` (`/` is necessary)

footer:
    since: 2018
    customText: Copyright © www.baidd.cn All Right Reserved

dateFormat:
    published: Jan 02, 2006
    lastUpdated: Jan 02, 2006 15:04 MST

sidebar:
    emoji: 🍥
    subtitle: Lorem ipsum dolor sit amet, consectetur adipiscing elit.
    avatar:
        enabled: true
        local: true
        src: img/avatar.jpeg

article:
    math: false
    toc: true
    readingTime: true
    license:
        enabled: true
        default: Licensed under CC BY-NC-SA 4.0

comments:
    enabled: true
    provider: utterances

    utterances:
        repo:
        issueTerm: pathname
        label:

widgets:
    homepage:
        - type: search
        - type: archives
          params:
              limit: 5
        - type: categories
          params:
              limit: 20
        # - type: tag-cloud
        #   params:
        #       limit: 10
    page:
        - type: toc

opengraph:
    twitter:
        # Your Twitter username
        site:

        # Available values: summary, summary_large_image
        card: summary_large_image

defaultImage:
    opengraph:
        enabled: false
        local: false
        src:

colorScheme:
    # Display toggle
    toggle: true

    # Available values: auto, light, dark
    default: auto

imageProcessing:
    cover:
        enabled: true
    content:
        enabled: true
